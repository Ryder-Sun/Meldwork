name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check website and release licensing consistency
        run: node --test ../meldwork-landing/test/landing.test.cjs

      - name: Build web application
        run: npm run build

      - name: Build desktop renderer
        run: npm run build:desktop

  desktop:
    name: Desktop tests and package validation
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Run desktop tests
        run: npm test
        working-directory: desktop

      - name: Run deterministic Eval Harness
        run: npm run eval:deterministic
        working-directory: desktop

      - name: Build unpacked desktop application
        run: npm run pack
        working-directory: desktop
